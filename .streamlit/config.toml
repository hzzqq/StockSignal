# StockSignal 全局主题配置（默认暗色·星辰决策仪表盘）
# 适用于所有页面，无需改动任何页面代码。
# 修改后重启 Streamlit 生效。
#
# ⚠️ 重要：此文件定义 Streamlit 原生主题的基底色。
#   默认模式="dark"（星辰风），与首页/侧边栏/卡片配色一致，
#   解决「页面导航时 spinner 闪现老 light 主题」—— WebSocket 连接时即锁定 dark，
#   CSS 只需做局部微调，不再有 light→dark 闪烁。
#   亮色模式由 modules/ui_theme.py 的 _LIGHT_CSS 覆盖（极少数用户主动切换）。

[theme]
base = "dark"
# 紫蓝主色调（品牌色）—— 用于主按钮、强调、链接
primaryColor = "#667eea"
# 应用主背景（深空黑 —— 星辰决策仪表盘风）
backgroundColor = "#0f0f23"
# 次级背景（卡片 / 输入框 / 侧边栏内面板）
secondaryBackgroundColor = "#1a1a2e"
# 正文文字（高对比浅色，WCAG AA 合规）
textColor = "#E2E8F0"
# 字体
font = "sans serif"
# T-261：全局基础字号 16→17px（数据密集仪表盘的舒适下限，全部 rem 尺寸随动放大；
# 用户反馈「默认字体有点小」。回滚 = 删除本行。）
# T-312 勘测纠偏：必须为整型（Streamlit CustomTheme proto 的 base_font_size 是 int），
# 写 "17px" 字符串会让每次 NewSession 消息创建抛 TypeError（'str' object cannot be
# interpreted as an integer），消息（携带 fragment ids）永远发不到前端 → 全站 run_every
# 轮询片段（星辰AI 等）失联、任务终态永不自动取回。守卫 tests/test_config_theme_types.py
baseFontSize = 17

[server]
# 前端端口固定 8899：避开元量软件（QMT/xt_trader 等）常占用的 8000-8300 段，
# 根治「启动抢端口」问题。与启动器 startup_sim.py 默认 --fe 8899 保持一致。
port = 8899
# 关闭默认的运行中提示，界面更干净
runOnSave = false
headless = true

[browser]
# 关闭使用情况统计，避免首次运行弹出邮箱提示
gatherUsageStats = false

[client]
# 禁用原生平铺页面导航，避免自定义分组侧边栏导航加载前「闪一下旧侧边栏」
showSidebarNavigation = false
# 侧边栏默认展开，确保自定义导航常驻可见（用户不再需要手动开侧边栏）
initial_sidebar_state = "expanded"
