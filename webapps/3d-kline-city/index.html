<!DOCTYPE html>
<!--
  3D K线城（StockSignal webapps 示例作品 #3）
  ------------------------------------------------
  · 单文件、零外部依赖：无外链 JS / 无外链字体 / 无图片，纯 HTML+CSS+Canvas+原生 JS，离线可跑。
  · 概念：把 A 股 K 线「竖」起来——每一根 K 线是一座建筑，
    楼高 = 当日涨跌幅（|涨跌幅| 越大楼越高），红涨绿跌（A 股口径），
    整体按透视投影 + 缓慢自转 + 轻微视差漂移交错成 3D 城市天际线。
  · 交互：鼠标悬停任意楼宇显示其「股票代码 / 涨跌 / 涨跌幅」（示意数据）。
  · 诚实红线：全部为静态示意数据，页面显著标注「示意数据 · 非实时行情」。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="纯 Canvas 的 A 股 K 线城市天际线：每根 K 线是一座楼，红涨绿跌，透视成 3D 城市（示意数据）。">
<title>3D K线城 · 示意数据</title>
<style>
  /* 全部内联样式，不请求任何外部资源 */
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 38%, #14122b 0%, #0a0a1a 60%, #05050f 100%);
    color: #e4e4f4;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #city { position: absolute; inset: 0; display: block; cursor: crosshair; }
  /* 左上角作品标题 + 一句描述 */
  #title {
    position: absolute; top: 16px; left: 18px; z-index: 2;
    font-size: 18px; font-weight: 700; color: #a5b4fc;
    text-shadow: 0 2px 12px rgba(79,70,229,.6); user-select: none; pointer-events: none;
  }
  #subtitle {
    position: absolute; top: 42px; left: 18px; z-index: 2;
    max-width: min(560px, 86vw); font-size: 12px; line-height: 1.6;
    color: #b9b9d8; user-select: none; pointer-events: none;
  }
  /* 右上角「示意数据」诚实标注：红色描边醒目，常驻 */
  #badge {
    position: absolute; top: 16px; right: 16px; z-index: 2;
    padding: 6px 14px; border-radius: 999px;
    border: 1px solid rgba(220,38,38,.55);
    background: rgba(220,38,38,.12);
    color: #f87171; font-size: 13px; font-weight: 700; letter-spacing: 1px;
    user-select: none; pointer-events: none;
  }
  /* 左下角图例：红涨 / 绿跌 */
  #legend {
    position: absolute; left: 18px; bottom: 16px; z-index: 2;
    font-size: 13px; font-weight: 700; user-select: none; pointer-events: none;
    background: rgba(10,10,26,.55); padding: 6px 12px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,.08);
  }
  #legend .up   { color: #ff6b6b; }
  #legend .down { color: #22e08a; }
  /* 悬停信息卡 */
  #tip {
    position: absolute; z-index: 3; pointer-events: none;
    padding: 6px 10px; border-radius: 8px;
    background: rgba(12,12,28,.92); border: 1px solid rgba(129,140,248,.5);
    font-size: 13px; white-space: nowrap;
    box-shadow: 0 6px 24px rgba(0,0,0,.5);
  }
  /* 右下角状态：自转中 + 楼宇数 */
  #hud {
    position: absolute; right: 16px; bottom: 16px; z-index: 2;
    font-size: 11px; color: #6f6f93; user-select: none; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="city"></canvas>
<div id="title">🏙️ 3D K线城</div>
<div id="subtitle">把 A 股 K 线竖起来：每根 K 线是一座楼，楼高 = 当日涨跌幅，红涨绿跌，透视投影成 3D 城市天际线（示意数据）。</div>
<div id="badge">示意数据 · 非实时行情</div>
<div id="legend"><span class="up">■ 涨</span>&nbsp;&nbsp;<span class="down">■ 跌</span></div>
<div id="tip" hidden></div>
<div id="hud">缓慢自转中 · 悬停查看个股</div>

<script>
"use strict";
/* =====================================================================
 * 0. 画布自适应（devicePixelRatio 高清 + 窗口尺寸）
 * ===================================================================== */
var canvas = document.getElementById("city");
var ctx = canvas.getContext("2d");
var W, H, cx, cy, focal;
function resize() {
  var dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2;
  cy = H * 0.56;                 // 地平线略低于中心，给天空留出空间
  focal = Math.min(W, H) * 0.95; // 焦距随视口缩放，保证城市铺满
}
window.addEventListener("resize", resize);
resize();

/* =====================================================================
 * 1. 数据层：A 股示意数据集（静态、确定性，绝不伪装实时）
 *    · 网格 COLS×ROWS 共 ~200 栋「楼」，每栋 = 一只股票的当日 K 线示意。
 *    · 涨跌幅 change ∈ [-9.8%, +9.8%]；楼高 = |change| 的线性映射。
 *    · 红涨绿跌（A 股口径）：up → 红，down → 绿。
 * ===================================================================== */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(20261102); // 固定种子 → 每次打开城市完全相同（示意）

var COLS = 18, ROWS = 11;       // 198 栋，符合「几百根以内」
var MIN_H = 0.18, MAX_H = 3.2;  // 楼高范围（世界单位）
var FP = 0.62;                  // 楼体底面边长（留街道间隙）

var C_UP   = [255, 77, 79];     // #ff4d4f 红 = 涨
var C_DOWN = [34, 224, 138];    // #22e08a 绿 = 跌

function genCode() {
  // 6 位 A 股代码示意：60/00/30 开头
  var pre = ["600", "601", "603", "000", "002", "300"][Math.floor(rng() * 6)];
  var n = Math.floor(rng() * 1000);
  return pre + ("000" + n).slice(-3);
}

var buildings = [];
for (var r = 0; r < ROWS; r++) {
  for (var c = 0; c < COLS; c++) {
    var change = (rng() * 2 - 1) * 9.8;          // [-9.8, 9.8]
    var up = change >= 0;
    var mag = Math.abs(change) / 10;             // 0..0.98
    var h = MIN_H + mag * (MAX_H - MIN_H);       // 楼高编码涨跌幅
    var bodyRatio = 0.32 + rng() * 0.4;          // 实体占比（开-收区间示意）
    buildings.push({
      code: genCode(),
      change: change,
      up: up,
      gx: (c - (COLS - 1) / 2) * 1.0,            // 世界 X（街道间距 1.0）
      gz: (r - (ROWS - 1) / 2) * 1.0,            // 世界 Z
      h: h,
      bodyRatio: bodyRatio,
      rgb: up ? C_UP : C_DOWN
    });
  }
}

/* =====================================================================
 * 2. 透视投影 + 相机（绕 Y 轴缓慢自转 + 轻微视差漂移）
 *    世界坐标 (x, y, z)：x 右，y 上，z 远离相机。
 *    投影：先绕 Y 旋转 camAngle，再透视除深度 d = Z + CAM_DIST。
 * ===================================================================== */
var CAM_DIST = 16;   // 相机距城市中心
var CAM_H = 1.6;    // 相机抬高量 → 略俯视
var camAngle = 0.6;  // 初始视角
var bob = 0;

var LX = -0.40, LZ = -0.60; // 相机空间光照方向（左上前方），用于楼面明暗
var AMB = 0.35, DIFF = 0.65;

function project(x, y, z) {
  var c = Math.cos(camAngle), s = Math.sin(camAngle);
  var X = x * c + z * s;
  var Z = -x * s + z * c;
  var d = Z + CAM_DIST;
  if (d < 0.1) d = 0.1;
  return { x: cx + (focal * X) / d, y: cy - (focal * (y - CAM_H)) / d, d: d };
}

function shade(rgb, k) {
  return "rgb(" + Math.round(rgb[0] * k) + "," + Math.round(rgb[1] * k) + "," + Math.round(rgb[2] * k) + ")";
}

/* 楼顶辉光描边：按颜色分组，每帧只做 2 次 shadowBlur 描边（性能友好） */
var rimRed = [], rimGreen = [];

/* 画一个轴对齐长方体（绕 Y 投影后）。yLo..yHi 为高度区间。 */
function drawBox(gx, gz, fp, yLo, yHi, rgb, glow) {
  var hx = fp / 2;
  // 8 角点（底面 0-3，顶面 4-7）
  var pts = [
    { x: gx - hx, y: yLo, z: gz - hx }, { x: gx + hx, y: yLo, z: gz - hx },
    { x: gx + hx, y: yLo, z: gz + hx }, { x: gx - hx, y: yLo, z: gz + hx },
    { x: gx - hx, y: yHi, z: gz - hx }, { x: gx + hx, y: yHi, z: gz - hx },
    { x: gx + hx, y: yHi, z: gz + hx }, { x: gx - hx, y: yHi, z: gz + hx }
  ];
  var P = pts.map(function (p) { return project(p.x, p.y, p.z); });

  // 面定义（侧面先画，顶面最后画压在上层）
  var faces = [
    { i: [1, 2, 6, 5], n: [1, 0, 0] },   // +X
    { i: [0, 3, 7, 4], n: [-1, 0, 0] },  // -X
    { i: [2, 3, 7, 6], n: [0, 0, 1] },   // +Z
    { i: [0, 1, 5, 4], n: [0, 0, -1] },  // -Z
    { i: [4, 5, 6, 7], n: [0, 0, 0], top: true } // 顶
  ];
  for (var f = 0; f < faces.length; f++) {
    var fc = faces[f];
    var b;
    if (fc.top) {
      b = 1.0;
    } else {
      var n = fc.n;
      var nZ = -n[0] * Math.sin(camAngle) + n[2] * Math.cos(camAngle);
      if (nZ >= 0) continue; // 背面剔除
      var nx = n[0] * Math.cos(camAngle) + n[2] * Math.sin(camAngle);
      var nz = nZ;
      var dot = nx * LX + nz * LZ;
      b = AMB + DIFF * Math.max(0, dot);
    }
    if (!glow) b *= 0.5; // 影线（细杆）压暗
    var p0 = P[fc.i[0]];
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    for (var k = 1; k < fc.i.length; k++) { var pp = P[fc.i[k]]; ctx.lineTo(pp.x, pp.y); }
    ctx.closePath();
    ctx.fillStyle = shade(rgb, b);
    ctx.fill();
    if (fc.top && glow) {
      (rgb[0] === C_UP[0] && rgb[1] === C_UP[1] ? rimRed : rimGreen).push(
        [P[4], P[5], P[6], P[7]]
      );
    }
  }
}

/* 一次性描出某颜色组的所有楼顶辉光 */
function strokeRims(arr, color) {
  if (!arr.length) return;
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 10;
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  for (var i = 0; i < arr.length; i++) {
    var q = arr[i];
    ctx.moveTo(q[0].x, q[0].y);
    ctx.lineTo(q[1].x, q[1].y);
    ctx.lineTo(q[2].x, q[2].y);
    ctx.lineTo(q[3].x, q[3].y);
    ctx.closePath();
  }
  ctx.stroke();
  ctx.restore();
}

/* =====================================================================
 * 3. 悬停命中（每帧记录楼顶屏幕坐标，鼠标移动时就近匹配）
 * ===================================================================== */
var hitList = [];
var tip = document.getElementById("tip");
window.addEventListener("mousemove", function (e) {
  var mx = e.clientX, my = e.clientY, best = -1, bd = 28 * 28;
  for (var i = 0; i < hitList.length; i++) {
    var dx = hitList[i].x - mx, dy = hitList[i].y - my, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = i; }
  }
  if (best >= 0) {
    var h = hitList[best];
    tip.hidden = false;
    tip.style.left = (mx + 16) + "px";
    tip.style.top = (my + 16) + "px";
    var col = h.up ? "#ff6b6b" : "#22e08a";
    var arrow = h.up ? "▲ +" : "▼ ";
    tip.innerHTML = "<b>" + h.code + "</b> <span style='color:" + col + "'>" + arrow + h.ch.toFixed(2) + "%</span>";
  } else {
    tip.hidden = true;
  }
});

/* =====================================================================
 * 4. 主循环：背景渐变 → 楼（远→近画家算法）→ 楼顶辉光 → 悬停记录
 * ===================================================================== */
function draw() {
  // 背景：上深下更深的竖直渐变 + 地平线微光
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0.00, "#0a0a1a");
  g.addColorStop(0.50, "#0d0b22");
  g.addColorStop(0.60, "#181338");
  g.addColorStop(1.00, "#05050f");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 按深度排序（远 → 近），保证遮挡正确
  var order = buildings.map(function (b, idx) { return idx; });
  order.sort(function (a, b) {
    var da = project(buildings[a].gx, 0, buildings[a].gz).d;
    var db = project(buildings[b].gx, 0, buildings[b].gz).d;
    return db - da;
  });

  rimRed.length = 0; rimGreen.length = 0;
  hitList.length = 0;

  for (var i = 0; i < order.length; i++) {
    var b = buildings[order[i]];
    var bodyH = b.h * b.bodyRatio;
    var bodyLo = (b.h - bodyH) / 2;        // 实体居中，影线贯穿 0..h
    var bodyHi = bodyLo + bodyH;
    // 影线（细，暗）
    drawBox(b.gx, b.gz, FP * 0.22, 0, b.h, b.rgb, false);
    // 实体（粗，亮 + 楼顶辉光）
    drawBox(b.gx, b.gz, FP, bodyLo, bodyHi, b.rgb, true);
    // 悬停命中点 = 楼顶中心
    var top = project(b.gx, b.h, b.gz);
    hitList.push({ x: top.x, y: top.y, code: b.code, up: b.up, ch: b.change });
  }

  // 楼顶辉光（仅 2 次 shadowBlur 描边，整体霓虹感）
  strokeRims(rimRed, "rgba(255,90,90,0.95)");
  strokeRims(rimGreen, "rgba(40,235,150,0.95)");

  // 相机缓慢自转 + 轻微视差上下漂
  camAngle += 0.0026;
  bob += 0.012;
  CAM_H = 1.6 + Math.sin(bob) * 0.35;

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
