name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov ruff mypy pip-audit

      - name: Init database (create schema + seed)
        run: python -m backend.scripts.init_db

      - name: Backend security regression (12/12)
        run: python -m backend.tests.test_security

      - name: Full offline unit tests (not live)
        # P1-4：全量不联网单测。-m "not live" 剔除真网（live）用例；
        # conftest 已在 session 级屏蔽网络、隔离数据落盘（SS_DATA_DIR /
        # DATABASE_URL 均指向会话临时目录）、跳过 SQLite WAL PRAGMA（测试库
        # 保持默认 DELETE journal，避免与常驻服务争锁且不生成 -wal/-shm）、
        # 禁用 backend 5 个后台调度线程。init_db 已先行建库（backend 路由契约
        # 测试依赖）。
        run: python -m pytest tests/ -m "not live" -q

      - name: Ruff lint (zero-error baseline)
        # P1-6：ruff 全量清零。既有违规已通过 `ruff check . --add-noqa` 固化为
        # 显式 noqa（1351 条，2026-11-04），此后新增违规即失败。
        run: python -m ruff check .

      - name: mypy contract layer (backend, strict)
        # P1-6：backend/ 契约层 mypy 严格检查，0 error 基线（2026-11-04）。
        # 唯一例外 backend.models（Flask-SQLAlchemy 动态 Model 基类，见 pyproject）。
        run: python -m mypy backend/ --no-incremental

      - name: pip-audit dependency vulnerability scan
        # P2-7：依赖漏洞扫描。当前基线（2026-11-04）：
        #   pillow 12.3.0 → 40 漏洞（修 13.0.0）；certifi 2026.7.22 → 1 漏洞
        #   （修 2026.10.18）；pip 已升至 26.3 消除工具链漏洞。
        # 修复命令：pip install --upgrade "pillow>=13.0.0" "certifi>=2026.10.18"
        # 依赖修复后请移除 continue-on-error 转为硬门禁。
        continue-on-error: true
        run: python -m pip_audit --format json

      - name: Coverage gate (core six modules, fail-under=70)
        # P0-3：覆盖率门禁由 CI 持续校验。核心六模块为技术分析/数据治理主链路，
        # 2026-11-04 实测基线 91.48%（fail-under=70）。覆盖率跌破 70% 即失败。
        run: >-
          python -m pytest
          tests/test_whitebox_technical.py
          tests/test_shepherd*.py
          tests/test_page_data_contract.py
          tests/test_perf_guard.py
          tests/test_quality_gate_core.py
          --cov=modules.technical
          --cov=modules.shepherd
          --cov=modules.cleaner
          --cov=modules.fetcher
          --cov=modules.timeout_exec
          --cov=modules.fetch_parallel
          --cov-fail-under=70
          -q


  frontend-v2:
    name: Frontend v2 (typecheck + vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-v2
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        working-directory: frontend-v2
        run: npm run typecheck

      # 含 contract-drift A 段（MSW fixture ↔ Zod / 含 diagnostics 契约）、
      # 路由懒加载、导航守卫、页面三态等；实时 B 段由 contract-drift-live job 单独跑。
      - name: Vitest (incl. contract-drift guards)
        working-directory: frontend-v2
        run: npm test

      - name: Production build
        working-directory: frontend-v2
        run: npm run build


  contract-drift-live:
    name: Live backend JSON vs Zod contract drift
    runs-on: ubuntu-latest
    env:
      # 真实后端启动会拉起 6 个守护调度线程；CI 全关，避免触网/写数据干扰校验
      STOCKSIGNAL_ENABLE_ALERT_SCHEDULER: "0"
      STOCKSIGNAL_ENABLE_COND_SCHEDULER: "0"
      STOCKSIGNAL_ENABLE_RESEARCH_WATCH: "0"
      STOCKSIGNAL_ENABLE_RECOMMEND_SCHEDULER: "0"
      STOCKSIGNAL_ENABLE_DATA_REFRESH: "0"
      STOCKSIGNAL_ENABLE_P1_SYNC_SCHEDULER: "0"
      SS_BACKEND_URL: http://127.0.0.1:5050
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend-v2
        run: npm ci

      - name: Init database (login account for B-segment)
        run: python -m backend.scripts.init_db

      - name: Seed REAL archived samples (contract checks only, never synthetic)
        # 字节级拷贝的 2026-11-15 归档样本；不含账号/密钥；历史数据不代表当前行情。
        # data/ 全部 gitignored，CI 全新 checkout 原本没有任何行情数据。
        run: |
          mkdir -p data/snapshots
          cp tests/fixtures/ci_data/*.json data/
          cp tests/fixtures/ci_data/snapshots/*.json data/snapshots/
          # manifest.json 是完整性清单（非行情样本），不得混进 data/ 冒充数据文件
          rm -f data/manifest.json

      # 后台服务与测试必须在同一个 step：跨 step 时后台进程可能被回收。
      # seed 后：有样本的端点返回真实 status=ok（Zod 真校验 data）；
      # 无样本的端点如实 status=error（降级信封也被校验，绝不洗成 ok）。
      # okCount>=2 防全线 SKIP 伪绿；checkedCount>=80% 防大面积 FETCH_ERR 伪绿。
      - name: Start real backend + run live contract drift
        run: |
          python -m flask --app backend.app:app run --host 127.0.0.1 --port 5050 --no-reload > /tmp/ss_backend.log 2>&1 &
          BACKEND_PID=$!
          trap 'kill "$BACKEND_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5050/api/health > /dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5050/api/health || { cat /tmp/ss_backend.log; exit 1; }
          cd frontend-v2
          npm test -- tests/unit/contract-drift.test.ts
