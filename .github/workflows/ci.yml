name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: StockSignal
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Init database (create schema + seed)
        run: python -m backend.scripts.init_db

      - name: Backend security regression (12/12)
        run: python -m backend.tests.test_security

      - name: Unit tests (pure-logic, no network)
        # 仅跑不依赖外网的单测，避免 CI 因行情源波动变红；
        # 网络相关测试需在本地/预览环境人工跑。
        run: >-
          python -m pytest
          tests/test_ssl_helper.py
          tests/test_screener_indicators.py
          tests/test_stock_screener.py
          tests/test_fundflow.py
          tests/test_sector_validation.py
          tests/test_linear_trends.py
          -q
