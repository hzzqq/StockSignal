<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" font-family="Microsoft YaHei, SimHei, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="880" height="580" fill="#ffffff"/>
  <text x="440" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">图 4-1　策略回测引擎执行流程</text>

  <!-- Row A -->
  <rect x="40" y="52" width="240" height="88" rx="10" fill="#eef2ff" stroke="#667eea" stroke-width="1.6"/>
  <text x="160" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#4338ca">① 参数配置</text>
  <text x="160" y="100" text-anchor="middle" font-size="11.5" fill="#475569">标的 / 区间 / 初始资金</text>
  <text x="160" y="118" text-anchor="middle" font-size="11.5" fill="#475569">佣金 0.001 · 滑点 0.001</text>
  <text x="160" y="134" text-anchor="middle" font-size="11.5" fill="#475569">印花税 0.001（仅卖出）</text>

  <rect x="320" y="52" width="240" height="88" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="440" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">② 数据获取</text>
  <text x="440" y="100" text-anchor="middle" font-size="11.5" fill="#475569">五级降级链取日线</text>
  <text x="440" y="118" text-anchor="middle" font-size="11.5" fill="#475569">akshare→BaoStock→新浪</text>
  <text x="440" y="134" text-anchor="middle" font-size="11.5" fill="#475569">→东财→本地缓存</text>

  <rect x="600" y="52" width="240" height="88" rx="10" fill="#f5f3ff" stroke="#764ba2" stroke-width="1.6"/>
  <text x="720" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b21b6">③ 信号生成</text>
  <text x="720" y="100" text-anchor="middle" font-size="11.5" fill="#475569">STRATEGY_REGISTRY 查表</text>
  <text x="720" y="118" text-anchor="middle" font-size="11.5" fill="#475569">BaseStrategy 产出信号序列</text>
  <text x="720" y="134" text-anchor="middle" font-size="11.5" fill="#475569">与撮合过程解耦</text>

  <line x1="280" y1="96" x2="316" y2="96" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="560" y1="96" x2="596" y2="96" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>

  <line x1="720" y1="140" x2="720" y2="178" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- Row B -->
  <rect x="40" y="182" width="800" height="150" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="440" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="#c2410c">④ 逐日撮合　BacktestEngine._simulate（backtest.py L536）</text>
  <text x="64" y="234" font-size="12" fill="#475569">· 逐根 K 线遍历：买入价 = close ×(1 + 滑点)，再计入佣金 → 得到实际成本价 entry_price</text>
  <text x="64" y="256" font-size="12" fill="#475569">· 卖出：卖出价 = close ×(1 − 滑点)，到手金额 = 股数 × 卖出价 ×(1 − 佣金 − 印花税)</text>
  <text x="64" y="278" font-size="12" fill="#475569">· 印花税仅卖出端单边征收；净收益率直接用实际现金流入 ÷ 实际现金流出，避免重复扣除</text>
  <text x="64" y="300" font-size="12" fill="#475569">· 平仓优先级：策略卖出 → 止损 5% → 止盈 3% → 移动止损 → 最大持有期 15 根（最小持有 2 根内不平）</text>

  <line x1="440" y1="332" x2="440" y2="368" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- Row C -->
  <rect x="40" y="372" width="380" height="88" rx="10" fill="#eef2ff" stroke="#667eea" stroke-width="1.6"/>
  <text x="230" y="398" text-anchor="middle" font-size="14" font-weight="bold" fill="#4338ca">⑤ 绩效统计</text>
  <text x="230" y="420" text-anchor="middle" font-size="11.5" fill="#475569">净值曲线 · 最大回撤 · 年化收益</text>
  <text x="230" y="438" text-anchor="middle" font-size="11.5" fill="#475569">胜率 · 盈亏比 · 逐笔明细</text>

  <rect x="460" y="372" width="380" height="88" rx="10" fill="#eef2ff" stroke="#667eea" stroke-width="1.6"/>
  <text x="650" y="398" text-anchor="middle" font-size="14" font-weight="bold" fill="#4338ca">⑥ 结果输出</text>
  <text x="650" y="420" text-anchor="middle" font-size="11.5" fill="#475569">equity_curve（净值序列）</text>
  <text x="650" y="438" text-anchor="middle" font-size="11.5" fill="#475569">trades（逐笔交易）· metrics（汇总指标）</text>

  <line x1="420" y1="416" x2="456" y2="416" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- Branch -->
  <rect x="40" y="490" width="800" height="66" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="440" y="516" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">并行扩展：批量回测与历史回溯</text>
  <text x="440" y="538" text-anchor="middle" font-size="11.5" fill="#475569">ProcessPoolExecutor 多进程调度 +  if __name__ == "__main__": 守卫　（shepherd_reconstruct.py L348 / L650）</text>
  <text x="440" y="554" text-anchor="middle" font-size="11" fill="#64748b">隔离 py_mini_racer / V8 子进程崩溃，避免拖垮主进程</text>
</svg>
