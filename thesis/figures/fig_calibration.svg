<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" height="570" font-family="Microsoft YaHei, SimHei, sans-serif">
  <defs>
    <marker id="ar4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="880" height="570" fill="#ffffff"/>
  <text x="440" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">图 5-2　刻度校准机制框图（含 T1/T2/T3 三条铁律护栏）</text>

  <rect x="60" y="48" width="400" height="54" rx="9" fill="#eef2ff" stroke="#667eea" stroke-width="1.6"/>
  <text x="260" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#4338ca">回测 / 对账样本（prediction_log）</text>
  <text x="260" y="92" text-anchor="middle" font-size="11" fill="#475569">by_group 归并为四大战术分组：进攻 / 分化 / 修复 / 防守</text>

  <line x1="260" y1="102" x2="260" y2="134" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar4)"/>

  <rect x="60" y="138" width="400" height="54" rx="9" fill="#f5f3ff" stroke="#764ba2" stroke-width="1.6"/>
  <text x="260" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b21b6">_suggest_delta（calibration.py L73）</text>
  <text x="260" y="182" text-anchor="middle" font-size="11" fill="#475569">sug_delta = clamp(2 × 次日平均实际涨跌, −5, +5)</text>

  <line x1="260" y1="192" x2="260" y2="224" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar4)"/>

  <rect x="60" y="228" width="400" height="56" rx="9" fill="#f5f3ff" stroke="#764ba2" stroke-width="1.6"/>
  <text x="260" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b21b6">suggestions()：是否 actionable？</text>
  <text x="260" y="272" text-anchor="middle" font-size="11" fill="#475569">actionable =（n_call ≥ strong）且（|delta| ≥ NOISE_DELTA）</text>

  <rect x="490" y="228" width="330" height="56" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="655" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">T3 小样本不表态</text>
  <text x="655" y="272" text-anchor="middle" font-size="11" fill="#475569">accuracy = null，如实沉默，不编造命中率</text>
  <line x1="460" y1="256" x2="486" y2="256" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar4)"/>
  <text x="473" y="246" text-anchor="middle" font-size="10.5" fill="#64748b">否</text>

  <line x1="260" y1="284" x2="260" y2="316" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar4)"/>
  <text x="272" y="304" font-size="10.5" fill="#64748b">是</text>

  <rect x="60" y="320" width="400" height="54" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="260" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">as_patch()：仅返回 CYCLE_ADJ 补丁 dict</text>
  <text x="260" y="364" text-anchor="middle" font-size="11" fill="#475569">T1 只出建议，绝不写 decision.py</text>

  <line x1="260" y1="374" x2="260" y2="406" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar4)"/>

  <rect x="60" y="410" width="400" height="54" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="260" y="434" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">人工 / 阈值确认</text>
  <text x="260" y="454" text-anchor="middle" font-size="11" fill="#475569">verdict.ready = any_actionable（至少一组达标）</text>

  <line x1="260" y1="464" x2="260" y2="496" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar4)"/>

  <rect x="60" y="500" width="400" height="54" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="260" y="524" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">apply_patch(dry_run=True 默认) 落地</text>
  <text x="260" y="544" text-anchor="middle" font-size="11" fill="#475569">写前备份 decision.py.bak + 审计日志 calibration_apply.log</text>

  <rect x="490" y="320" width="330" height="234" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="655" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">三条铁律（方法论核心）</text>
  <text x="512" y="378" font-size="11.5" fill="#334155">T1　只出建议、绝不自动改规则</text>
  <text x="524" y="398" font-size="11" fill="#64748b">小样本拟合 = 过拟合，禁止自动落地</text>
  <text x="512" y="428" font-size="11.5" fill="#334155">T2　有界 ±5（T2 有界，落地再收窄）</text>
  <text x="524" y="448" font-size="11" fill="#64748b">任何刻度修正都是微调而非漂移</text>
  <text x="512" y="478" font-size="11.5" fill="#334155">T3　小样本不表态</text>
  <text x="524" y="498" font-size="11" fill="#64748b">n_call&lt;8 不出观察行；&lt;20 或 |delta|&lt;2</text>
  <text x="524" y="516" font-size="11" fill="#64748b">→ actionable = False，系统如实沉默</text>
  <text x="524" y="542" font-size="11" fill="#64748b">对应单测：test_verdict_spread_not_ready</text>
</svg>
