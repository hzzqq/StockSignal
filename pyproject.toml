# ───────────────────────── 项目元数据与依赖（T-267 UV 接入） ─────────────────────────
# 单一依赖真理源：此前 requirements.txt 只固化前端/数据层 15 项，backend 的
# flask/pyjwt/sqlalchemy 等从未入库（环境不可复现）。UV lockfile（uv.lock）
# 全量锁定解析结果，uv sync 一键还原可复现环境（项目内 .venv，独立于共享 venv）。
[project]
name = "stocksignal"
version = "1.0.0"
description = "StockSignal · A股事件驱动投资分析平台"
requires-python = ">=3.11"
dependencies = [
    # ── 前端 / 数据层（原 requirements.txt）──
    "akshare>=1.12.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "mplfinance>=0.12.10b0",
    "plotly>=5.20.0",
    "streamlit>=1.35.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
    "tushare>=1.4.0",
    "jieba>=0.42.1",
    "snownlp>=0.12.3",
    "baostock>=0.8.8",
    "requests>=2.31.0",
    # ── backend（AST 实测 import，此前从未固化）──
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "flask-sqlalchemy>=3.1.0",
    "pyjwt>=2.8.0",
    "sqlalchemy>=2.0.0",
    "pypinyin>=0.51.0",
    "werkzeug>=3.0.0",
    # ── 测试 / 契约 ──
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# 券商本地客户端依赖：仅在启用 QMT/easytrader 实盘的机器安装（普通环境装不上）。
broker = ["easytrader>=0.6.0"]
dev = ["ruff>=0.6.0", "mypy>=1.10.0"]
# T-267 FastAPI 试点切片（backend_fastapi/，ASGI 新端点增量路线）
api = ["fastapi>=0.115.0", "uvicorn>=0.30.0"]

[tool.uv]
# 项目内独立环境（.venv），与共享 venv 完全隔离
package = false

[tool.ruff]
# 基线 lint 配置（渐进式引入，不强制全量通过）
line-length = 120
target-version = "py313"
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "backend/data",
    "tests",
    "quantagent",
    "scripts",
]

[tool.ruff.lint]
# F=pyflakes(未用/未定义), E=pycodestyle, I=isort, B=safe IO
select = ["F", "E", "I", "B", "UP"]
ignore = ["E501", "E402", "B008"]

[tool.ruff.lint.per-file-ignores]
"modules/quantagent/*" = ["F", "E", "I"]
"pages/*" = ["E402"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
follow_imports = "silent"
exclude = ["tests/", "quantagent/", "scripts/", "venv/"]

# 仅检查核心模块，避免第三方库(A股数据/plotly)类型缺失刷屏
[[tool.mypy.overrides]]
module = ["akshare.*", "baostock.*", "tushare.*", "plotly.*", "streamlit.*", "jieba.*", "snownlp.*"]
ignore_errors = true

# ───────────────────────── pytest 全局配置 ─────────────────────────
# 默认跑测试**不含覆盖率**（避免 Windows 沙箱 safe-delete 回收站在 combine/erase
# 阶段 OSError 中断整批）。覆盖率作为可选观测手段，手动开启：
#   pytest --cov=modules --cov-report=term-missing --cov-report=json:.coverage.json
# skip 率由 conftest 的 pytest_sessionfinish 钩子打印，暴露「黑盒大量 skip 虚高」问题。
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
filterwarnings = [
  "ignore::UserWarning",
]
# 真网集成测试默认不收集（评测集诊断 #4 落地）。手动开启：
#   OFFLINE_TEST=0 pytest -m live
markers = [
  "live: 真网集成测试，默认跳过；需 OFFLINE_TEST=0 显式开启（CI 定时跑，抓接口契约变更）",
]

[tool.coverage.run]
omit = [
  "tests/*",
  "scripts/*",
  "modules/quantagent/*",
  "*/__pycache__/*",
]
source = ["modules"]
# 并行模式：每个 pytest 进程写独立 .coverage.<host>.<pid> 文件，避免单文件 erase
# 触发 Windows 沙箱 safe-delete 回收站不可用导致的 OSError（_safe_remove 失败）。
parallel = true

# ───────────────────────── 覆盖率红线（评测集诊断 #2 落地） ─────────────────────────
# 评测集「全绿」不能掩盖黑盒 skip 虚高。核心模块设硬门槛，其余观测。
# 注意：沙箱内 coverage 写盘被 safe-delete 拦截，无法自动 fail_under；此处为 CI 可观测
# 门槛说明。CI 跑 `pytest --cov=modules --cov-fail-under=70`（仅核心模块）时强制报警。
#
# 核心模块（必须 >=70%）：
#   modules/technical.py, modules/shepherd.py, modules/cleaner.py,
#   modules/fetcher.py, modules/timeout_exec.py, modules/fetch_parallel.py
# 其余 modules/* 为观测项（不强制），但全量 skip 率 >30% 时 conftest 会打印 ⚠️。
#
# 开启命令（CI 定时 / 本地手动）：
#   OFFLINE_TEST=0 pytest --cov=modules --cov-report=term-missing \
#     --cov-fail-under=70 tests/test_whitebox_technical.py tests/test_shepherd*.py \
#     tests/test_page_data_contract.py tests/test_perf_guard.py
[tool.coverage.report]
# 红线条目：核心模块若低于此比例，CI 应报警（人工复核是否真 skip 过多）
fail_under = 70
show_missing = true
