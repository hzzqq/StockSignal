[tool.ruff]
# 基线 lint 配置（渐进式引入，不强制全量通过）
line-length = 120
target-version = "py313"
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "backend/data",
    "tests",
    "quantagent",
    "scripts",
]

[tool.ruff.lint]
# F=pyflakes(未用/未定义), E=pycodestyle, I=isort, B=safe IO
select = ["F", "E", "I", "B", "UP"]
ignore = ["E501", "E402", "B008"]

[tool.ruff.lint.per-file-ignores]
"modules/quantagent/*" = ["F", "E", "I"]
"pages/*" = ["E402"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
follow_imports = "silent"
exclude = ["tests/", "quantagent/", "scripts/", "venv/"]

# 仅检查核心模块，避免第三方库(A股数据/plotly)类型缺失刷屏
[[tool.mypy.overrides]]
module = ["akshare.*", "baostock.*", "tushare.*", "plotly.*", "streamlit.*", "jieba.*", "snownlp.*"]
ignore_errors = true

# ───────────────────────── pytest 全局配置 ─────────────────────────
# 默认跑测试**不含覆盖率**（避免 Windows 沙箱 safe-delete 回收站在 combine/erase
# 阶段 OSError 中断整批）。覆盖率作为可选观测手段，手动开启：
#   pytest --cov=modules --cov-report=term-missing --cov-report=json:.coverage.json
# skip 率由 conftest 的 pytest_sessionfinish 钩子打印，暴露「黑盒大量 skip 虚高」问题。
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
filterwarnings = [
  "ignore::UserWarning",
]
# 真网集成测试默认不收集（评测集诊断 #4 落地）。手动开启：
#   OFFLINE_TEST=0 pytest -m live
markers = [
  "live: 真网集成测试，默认跳过；需 OFFLINE_TEST=0 显式开启（CI 定时跑，抓接口契约变更）",
]

[tool.coverage.run]
omit = [
  "tests/*",
  "scripts/*",
  "modules/quantagent/*",
  "*/__pycache__/*",
]
source = ["modules"]
# 并行模式：每个 pytest 进程写独立 .coverage.<host>.<pid> 文件，避免单文件 erase
# 触发 Windows 沙箱 safe-delete 回收站不可用导致的 OSError（_safe_remove 失败）。
parallel = true

# ───────────────────────── 覆盖率红线（评测集诊断 #2 落地） ─────────────────────────
# 评测集「全绿」不能掩盖黑盒 skip 虚高。核心模块设硬门槛，其余观测。
# 注意：沙箱内 coverage 写盘被 safe-delete 拦截，无法自动 fail_under；此处为 CI 可观测
# 门槛说明。CI 跑 `pytest --cov=modules --cov-fail-under=70`（仅核心模块）时强制报警。
#
# 核心模块（必须 >=70%）：
#   modules/technical.py, modules/shepherd.py, modules/cleaner.py,
#   modules/fetcher.py, modules/timeout_exec.py, modules/fetch_parallel.py
# 其余 modules/* 为观测项（不强制），但全量 skip 率 >30% 时 conftest 会打印 ⚠️。
#
# 开启命令（CI 定时 / 本地手动）：
#   OFFLINE_TEST=0 pytest --cov=modules --cov-report=term-missing \
#     --cov-fail-under=70 tests/test_whitebox_technical.py tests/test_shepherd*.py \
#     tests/test_page_data_contract.py tests/test_perf_guard.py
[tool.coverage.report]
# 红线条目：核心模块若低于此比例，CI 应报警（人工复核是否真 skip 过多）
fail_under = 70
show_missing = true
